<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendee Registration</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; color: #1e293b; background-color: #f8fafc; line-height: 1.6; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 18px 40px; background: #ffffff; border-bottom: 1px solid #e2e8f0; }
        .logo { font-size: 18px; font-weight: 800; color: #0f172a; text-transform: uppercase; }
        .nav-links a { text-decoration: none; color: #64748b; font-size: 14px; font-weight: 600; margin-left: 15px; }
        
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
        .form-card { background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 35px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .form-card h1 { font-size: 26px; color: #0f172a; margin-top: 0; margin-bottom: 10px; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: #334155; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }

        .btn-submit { width: 100%; background: #16a34a; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-submit:hover { background: #15803d; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">🎉 Annual Gala 2026</div>
        <div class="nav-links">
            <a href="index.html">← Back to Event Details</a>
            <a href="rsvp.html">RSVP Page</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-card">
            <h1>Attendee Registration</h1>
            <p style="color: #64748b; margin-bottom: 25px;">Register your details below to receive official event passes and updates.</p>

            <form onsubmit="event.preventDefault(); alert('Registration successful!');">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="(555) 000-0000" required>
                </div>

                <div class="form-group">
                    <label>Registration Tier</label>
                    <select>
                        <option>General Admission (Free)</option>
                        <option>VIP Attendee Pass</option>
                        <option>Sponsor Representative</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Complete Registration</button>
            </form>
        </div>
    </div>

</body>
</html>
